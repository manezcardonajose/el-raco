{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2 style="color: #ff6b00;">Editar sección</h2>

    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nombre de sección:</label>
            <input type="text" name="seccion" value="{{ seccion.seccion or '' }}" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #2b2f33; color: white;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Orden:</label>
            <input type="number" name="orden" value="{{ seccion.orden or 0 }}" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #2b2f33; color: white;">
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn btn-success">Guardar cambios</button>
            <a href="{{ url_for('menus.ver_menu_diario', menu_id=seccion.menu_diario_id) }}" class="btn btn-red">Cancelar</a>
        </div>
    </form>
</div>

<style>
    .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; margin-right: 5px; }
    .btn-success { background: #28a745; color: white; }
    .btn-red { background: #dc3545; color: white; }
    label { display: block; margin-bottom: 5px; color: #ccc; }
</style>
{% endblock %}

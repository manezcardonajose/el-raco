{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-edit"></i> Editar menú del {{ menu.fecha }}</h2>
        <a href="{{ url_for('menus.ver_menu_diario', menu_id=menu.id) }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" value="{{ menu.fecha }}" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Tipo de menú</label>
            <select name="tipo_menu_id" required class="form-control">
                {% for t in tipos %}
                <option value="{{ t.id }}" {% if t.id == menu.tipo_menu_id %}selected{% endif %}>{{ t.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" rows="3" class="form-control">{{ menu.observaciones or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar cambios</button>
    </form>
</div>
{% endblock %}

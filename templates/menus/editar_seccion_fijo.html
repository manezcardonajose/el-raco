{% extends "base.html" %}

{% block content %}

<h2>Editar sección</h2>

<form method="POST">

    <p><strong>{{ seccion.subdepartamento_nombre }}</strong></p>

    <label>Nombre sección</label>
    <input type="text" name="seccion" value="{{ seccion.seccion }}">

    <br><br>

    <label>Orden</label>
    <input type="number" name="orden" value="{{ seccion.orden }}">

    <br><br>

    <button class="btn btn-success">Guardar</button>
    <a href="{{ url_for('menus.ver_menu_fijo', menu_id=seccion.menu_id) }}" class="btn btn-secondary">Cancelar</a>

</form>

{% endblock %}

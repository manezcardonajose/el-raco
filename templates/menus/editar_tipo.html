{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Editar tipo de menú</h2>

    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ tipo.nombre }}" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Punto de venta:</label>
            <select name="punto_venta_id" style="width: 100%; padding: 8px;">
                <option value="">-- Ninguno --</option>
                {% for pv in puntos_venta %}
                <option value="{{ pv.id }}" {% if tipo.punto_venta_id == pv.id %}selected{% endif %}>{{ pv.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label>
                <input type="checkbox" name="activo" {% if tipo.activo %}checked{% endif %}> Activo
            </label>
        </div>

        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="{{ url_for('menus.lista_tipos_menu') }}" class="btn btn-red">Cancelar</a>
    </form>
</div>
{% endblock %}

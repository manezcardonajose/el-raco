{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-plus-circle"></i> Nuevo menú diario</h2>
        <a href="{{ url_for('menus.lista_menus_principal') }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" value="{{ fecha_seleccionada or '' }}" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Tipo de menú</label>
            <select name="tipo_menu_id" required class="form-control">
                <option value="">Seleccionar...</option>
                {% for t in tipos %}
                <option value="{{ t.id }}" {% if t.id|string == tipo_seleccionado %}selected{% endif %}>{{ t.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" rows="3" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Crear menú</button>
    </form>
</div>
{% endblock %}

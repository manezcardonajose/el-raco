{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Nuevo tipo de menú</h2>

    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nombre del tipo:</label>
            <input type="text" name="nombre" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Punto de venta asociado:</label>
            <select name="punto_venta_id" style="width: 100%; padding: 8px;">
                <option value="">-- Ninguno --</option>
                {% for pv in puntos_venta %}
                <option value="{{ pv.id }}">{{ pv.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Crear tipo</button>
        <a href="{{ url_for('menus.lista_tipos_menu') }}" class="btn btn-red">Cancelar</a>
    </form>
</div>
{% endblock %}

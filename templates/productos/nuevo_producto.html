{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-plus-circle"></i> Nuevo producto</h2>
        <a href="{{ next_url or url_for('productos.productos') }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <input type="hidden" name="next" value="{{ next_url or url_for('productos.productos') }}">

        <div class="form-group">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Cantidad inicial</label>
            <input type="number" step="0.001" name="cantidad" class="form-control" value="0">
        </div>
        <div class="form-group">
            <label class="form-label">Unidad</label>
            <input type="text" name="unidad" class="form-control" value="kg">
        </div>
        <div class="form-group">
            <label class="form-label">Familia</label>
            <input type="text" name="familia" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Alergenos del producto</label>
            <input type="text" name="alergenos" class="form-control" placeholder="Ej. Apio, Leche, Frutos con cascara">
            <label style="display:flex;gap:6px;align-items:center;margin-top:6px;">
                <input type="checkbox" name="alergenos_validado" value="1">
                Revisado/validado para tarjetas
            </label>
        </div>
        <div class="form-group">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" name="precio" class="form-control" value="0">
        </div>
        <div class="form-group">
            <label class="form-label">Stock minimo</label>
            <input type="number" step="0.001" name="stock_minimo" class="form-control" value="0">
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar producto</button>
            <a href="{{ next_url or url_for('productos.productos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

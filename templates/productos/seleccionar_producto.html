<!DOCTYPE html>
<html>
<head>
    <title>Aadir Producto a Receta</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #2b2f33;
            color: #e4e6eb;
            padding: 20px;
            margin: 0;
        }
        
        h2 {
            color: #ff6b00;
            border-left: 5px solid #ff6b00;
            padding-left: 10px;
            margin-top: 0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .card {
            background: #3a3f44;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        
        .btn {
            background: #ff6b00;
            color: white;
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            display: inline-block;
        }
        
        .btn-success {
            background: #28a745;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: none;
            border-radius: 4px;
            background: #4a4f55;
            color: white;
            box-sizing: border-box;
        }
        
        .flash {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success { background: #28a745; }
        .danger { background: #dc3545; }
        .warning { background: #ffc107; color: black; }
        
        .pestaas {
            display: flex;
            gap: 2px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ff6b00;
        }
        
        .pestaa {
            padding: 10px 20px;
            background: #4a4f55;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            color: #e4e6eb;
        }
        
        .pestaa.activa {
            background: #ff6b00;
            color: white;
            font-weight: bold;
        }
        
        .contenido-pestaa {
            display: none;
        }
        
        .contenido-pestaa.activa {
            display: block;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2> Aadir Producto a Receta</h2>
    
    <div class="container">
        <!-- Mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <!-- Pestaas -->
        <div class="pestaas">
            <div class="pestaa activa" onclick="mostrarPestaa('existente')"> Productos Existentes</div>
            <div class="pestaa" onclick="mostrarPestaa('nuevo')"> Crear Nuevo Producto</div>
        </div>
        
        <!-- Contenido: Productos existentes -->
        <div id="existente" class="contenido-pestaa activa card">
            <h3>Seleccionar Producto Existente</h3>
            
            <form method="POST" action="{{ url_for('recetas.agregar_ingrediente_ventana', receta_id=receta_id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>Producto:</label>
                <select name="producto_id" required>
                    <option value="">-- Selecciona un producto --</option>
                    {% for producto in productos %}
                    <option value="{{ producto['id'] }}">
                        {{ producto['nombre'] }} ({{ producto['unidad'] }}) - {{ "%.2f"|format(producto['precio']) }} 
                    </option>
                    {% endfor %}
                </select>
                
                <label>Cantidad:</label>
                <input type="number" step="0.01" name="cantidad" required>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-success"> Aadir</button>
                    <button type="button" class="btn btn-secondary" onclick="window.close()"> Cancelar</button>
                </div>
            </form>
        </div>
        
        <!-- Contenido: Crear nuevo producto -->
        <div id="nuevo" class="contenido-pestaa card">
            <h3>Crear Nuevo Producto</h3>
            
            <form method="POST" action="{{ url_for('recetas.nuevo_producto_ventana', receta_id=receta_id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>Nombre del producto:</label>
                <input type="text" name="nombre" required>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label>Unidad:</label>
                        <select name="unidad" required>
                            <option value="ud">ud</option>
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="l">l</option>
                            <option value="ml">ml</option>
                        </select>
                    </div>
                    
                    <div>
                        <label>Precio ():</label>
                        <input type="number" step="0.01" name="precio" required>
                    </div>
                </div>
                
                <label>Tipo conservacin:</label>
                <select name="tipo_conservacion">
                    <option value="seco">Seco</option>
                    <option value="refrigerado">Refrigerado</option>
                    <option value="congelado">Congelado</option>
                </select>
                
                <label>Familia:</label>
                <select name="familia">
                    <option value="lcteos">Lcteos</option>
                    <option value="carnes">Carnes</option>
                    <option value="pescados">Pescados</option>
                    <option value="verduras">Verduras</option>
                    <option value="otros">Otros</option>
                </select>
                
                <label>Cantidad para la receta:</label>
                <input type="number" step="0.01" name="cantidad_ingrediente" required>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-success"> Crear y Aadir</button>
                    <button type="button" class="btn btn-secondary" onclick="window.close()"> Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function mostrarPestaa(id) {
            // Ocultar todas las pestaas
            document.querySelectorAll('.contenido-pestaa').forEach(el => {
                el.classList.remove('activa');
            });
            
            // Desactivar todas las pestaas
            document.querySelectorAll('.pestaa').forEach(el => {
                el.classList.remove('activa');
            });
            
            // Activar la seleccionada
            document.getElementById(id).classList.add('activa');
            event.target.classList.add('activa');
        }
    </script>
</body>
</html>

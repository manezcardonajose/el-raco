{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-plus-circle"></i> Nuevo proveedor</h2>
        <a href="{{ url_for('proveedores.proveedores') }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">NIF</label>
            <input type="text" name="nif" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Email pedidos</label>
            <input type="email" name="email_pedidos" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Telefono pedidos</label>
            <input type="text" name="telefono_pedidos" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Dirección</label>
            <input type="text" name="direccion" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Contacto</label>
            <input type="text" name="contacto" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Contacto pedidos</label>
            <input type="text" name="contacto_pedidos" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Centro</label>
            <select name="centro_id" class="form-control">
                <option value="global">Proveedor matriz / cadena</option>
                {% for c in centros %}
                <option value="{{ c.id }}" {% if c.id == centro_id %}selected{% endif %}>{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Proveedor matriz</label>
            <select name="proveedor_padre_id" class="form-control">
                <option value="">Sin matriz</option>
                {% for p in matrices %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Delegacion</label>
            <input type="text" name="delegacion" class="form-control" placeholder="Tenerife, Madrid, Ibiza...">
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" rows="3" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar proveedor</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Editar Receta: {{ receta.nombre }}</h2>
    <form method="POST">
        <div>
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ receta.nombre }}" required>
        </div>
        <div>
            <label>Categoría:</label>
            <input type="text" name="categoria" value="{{ receta.categoria or '' }}">
        </div>
        <div>
            <label>Tiempo (min):</label>
            <input type="number" name="tiempo" value="{{ receta.tiempo_preparacion or '' }}">
        </div>
        <div>
            <label>Instrucciones:</label>
            <textarea name="instrucciones">{{ receta.instrucciones or '' }}</textarea>
        </div>
        
        <h3>Ingredientes</h3>
        <div id="ingredientes">
            {% for ing in ingredientes %}
            <div class="ingrediente-fila">
                <select name="ingrediente_id[]">
                    <option value="">-- Seleccionar --</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" {% if p.id == ing.producto_id %}selected{% endif %}>{{ p.nombre }}</option>
                    {% endfor %}
                </select>
                <input type="number" step="0.01" name="cantidad[]" value="{{ ing.cantidad }}">
                <input type="text" name="unidad[]" value="{{ ing.unidad }}" placeholder="ud">
                <button type="button" onclick="this.parentElement.remove()">Eliminar</button>
            </div>
            {% endfor %}
        </div>
        <button type="button" onclick="agregarIngrediente()">Añadir ingrediente</button>
        <br>
        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('recetas.ver_receta', receta_id=receta.id) }}">Cancelar</a>
    </form>
</div>
<script>
function agregarIngrediente() {
    const div = document.createElement('div');
    div.className = 'ingrediente-fila';
    div.innerHTML = `
        <select name="ingrediente_id[]">
            <option value="">-- Seleccionar --</option>
            {% for p in productos %}
            <option value="{{ p.id }}">{{ p.nombre }}</option>
            {% endfor %}
        </select>
        <input type="number" step="0.01" name="cantidad[]" value="">
        <input type="text" name="unidad[]" value="" placeholder="ud">
        <button type="button" onclick="this.parentElement.remove()">Eliminar</button>
    `;
    document.getElementById('ingredientes').appendChild(div);
}
</script>
{% endblock %}

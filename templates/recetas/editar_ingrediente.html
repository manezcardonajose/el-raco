{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>️ Editar ingrediente</h2>
    
    <p><strong>Producto:</strong> {{ ingrediente.nombre }}</p>
    <p><strong>Unidad:</strong> {{ ingrediente.unidad }}</p>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Cantidad:</label>
            <input type="number" step="0.01" name="cantidad" value="{{ ingrediente.cantidad }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="/recetas/{{ ingrediente.receta_id }}" class="btn btn-red">Cancelar</a>
    </form>
</div>
{% endblock %}

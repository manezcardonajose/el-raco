{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-plus-circle"></i> Nueva receta</h2>
        <a href="{{ url_for('recetas.recetas') }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Nombre de la receta</label>
            <input type="text" name="nombre" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" rows="4" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Alérgenos</label>
            <input type="text" name="alergenos" class="form-control" placeholder="Ej. Gluten, Huevo, Leche">
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Crear receta</button>
    </form>
</div>
{% endblock %}

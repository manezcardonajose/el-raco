{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 style="color:#ff6b00;">Registrar equipo / activo</h2>
        <a href="{{ url_for('mantenimiento.lista_equipos') }}" class="btn btn-secondary">Volver</a>
    </div>

    <form method="POST">
        <div style="display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:16px;">
            <div class="form-group">
                <label class="form-label">Codigo interno</label>
                <input class="form-control" name="codigo" placeholder="Ej: HAB-005-CAMA">
            </div>
            <div class="form-group">
                <label class="form-label">Nombre del equipo</label>
                <input class="form-control" name="nombre" required placeholder="Ej: Cama habitacion 005">
            </div>
            <div class="form-group">
                <label class="form-label">Tipo</label>
                <select class="form-control" name="tipo" required>
                    <option value="habitacion">Habitacion / mobiliario</option>
                    <option value="instalacion">Instalacion</option>
                    <option value="climatizacion">Climatizacion</option>
                    <option value="frio">Frio / camara</option>
                    <option value="cocina">Cocina</option>
                    <option value="lavanderia">Lavanderia</option>
                    <option value="electricidad">Electricidad</option>
                    <option value="fontaneria">Fontaneria</option>
                    <option value="seguridad">Seguridad</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Familia</label>
                <input class="form-control" name="familia" placeholder="Pisos, cocina, recepcion, mantenimiento...">
            </div>
            <div class="form-group">
                <label class="form-label">Clase activo</label>
                <input class="form-control" name="clase_activo" placeholder="Mobiliario, maquinaria, instalacion...">
            </div>
            <div class="form-group">
                <label class="form-label">Criticidad</label>
                <select class="form-control" name="criticidad">
                    <option value="media">Media</option>
                    <option value="baja">Baja</option>
                    <option value="alta">Alta</option>
                    <option value="critica">Critica</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Marca</label>
                <input class="form-control" name="marca">
            </div>
            <div class="form-group">
                <label class="form-label">Modelo</label>
                <input class="form-control" name="modelo">
            </div>
            <div class="form-group">
                <label class="form-label">Numero de serie</label>
                <input class="form-control" name="numero_serie">
            </div>
            <div class="form-group">
                <label class="form-label">Proveedor</label>
                <select class="form-control" name="proveedor_id">
                    <option value="">Sin proveedor</option>
                    {% for p in proveedores %}<option value="{{ p.id }}">{{ p.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Fecha compra</label>
                <input class="form-control" type="date" name="fecha_compra">
            </div>
            <div class="form-group">
                <label class="form-label">Fecha instalacion</label>
                <input class="form-control" type="date" name="fecha_instalacion">
            </div>
            <div class="form-group">
                <label class="form-label">Garantia meses</label>
                <input class="form-control" type="number" min="0" name="garantia_meses">
            </div>
            <div class="form-group">
                <label class="form-label">Ubicacion</label>
                <input class="form-control" name="ubicacion" placeholder="Ej: Habitacion 005, Cocina caliente, Bar piscina">
            </div>
            <div class="form-group">
                <label class="form-label">Departamento</label>
                <select class="form-control" name="departamento_id">
                    <option value="">Sin departamento</option>
                    {% for d in departamentos %}<option value="{{ d.id }}">{{ d.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Subdepartamento</label>
                <select class="form-control" name="subdepartamento_id">
                    <option value="">Sin subdepartamento</option>
                    {% for s in subdepartamentos %}<option value="{{ s.id }}">{{ s.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Punto de venta</label>
                <select class="form-control" name="punto_venta_id">
                    <option value="">Sin punto de venta</option>
                    {% for pv in puntos_venta %}<option value="{{ pv.id }}">{{ pv.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Control</label>
                <label style="display:block;margin-top:8px;"><input type="checkbox" name="inventariable" value="1" checked> Inventariable</label>
                <label style="display:block;margin-top:8px;"><input type="checkbox" name="requiere_appcc" value="1"> Tiene control APPCC vinculado</label>
            </div>
        </div>

        <div style="margin-top:24px;">
            <button type="submit" class="btn btn-success">Guardar equipo</button>
            <a href="{{ url_for('mantenimiento.lista_equipos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

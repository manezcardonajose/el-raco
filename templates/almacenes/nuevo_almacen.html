{% extends "base.html" %}

{% block content %}
<div class="container">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1>Nuevo almacén</h1>

        <div style="display:flex; gap:10px;">
            <a href="{{ url_for('almacenes.almacenes') }}" class="btn btn-secondary">
                ← Volver
            </a>
        </div>
    </div>

    <div class="card">
        <form method="POST">

            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" required class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">Tipo</label>
                <select name="tipo" class="form-control">
                    <option value="seco">Seco</option>
                    <option value="refrigerado">Refrigerado</option>
                    <option value="congelado">Congelado</option>
                    <option value="botellero">Botellero</option>
                    <option value="camara">Camara</option>
                    <option value="vitrina">Vitrina refrigerada</option>
                </select>
            </div>

            <div class="form-group" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
                <label class="form-label" style="background:#1d2530;border:1px solid #34465c;border-radius:6px;padding:10px;">
                    <input type="checkbox" name="crear_equipo">
                    Crear tambien equipo de mantenimiento
                </label>
                <label class="form-label" style="background:#1d2530;border:1px solid #34465c;border-radius:6px;padding:10px;">
                    <input type="checkbox" name="requiere_control_temperatura">
                    Control de temperatura / APPCC
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">Criticidad</label>
                <select name="criticidad" class="form-control">
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                    <option value="baja">Baja</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Ubicación</label>
                <input type="text" name="ubicacion" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">Responsable</label>
                <input type="text" name="responsable" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">Rango minimo si controla temperatura</label>
                <input type="number" step="0.1" name="rango_min" class="form-control" placeholder="Ej: 0 o -24">
            </div>

            <div class="form-group">
                <label class="form-label">Rango maximo si controla temperatura</label>
                <input type="number" step="0.1" name="rango_max" class="form-control" placeholder="Ej: 5 o -18">
            </div>

            <div class="form-group">
                <label class="form-label">Departamento</label>
                <select name="departamento_id" class="form-control">
                    <option value="">-- Ninguno --</option>
                    {% for d in departamentos %}
                    <option value="{{ d.id }}">{{ d.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Subdepartamento</label>
                <select name="subdepartamento_id" class="form-control">
                    <option value="">-- Ninguno --</option>
                    {% for s in subdepartamentos %}
                    <option value="{{ s.id }}">{{ s.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-top:20px; display:flex; gap:10px;">
                <button type="submit" class="btn btn-success">
                    💾 Guardar
                </button>

                <a href="{{ url_for('almacenes.almacenes') }}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>

        </form>
    </div>

</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="card">

    <!-- CABECERA -->
    <div class="card-header" style="display:flex; justify-content:space-between; flex-wrap:wrap;">
        <h2><i class="fas fa-layer-group"></i> {{ departamento.nombre }}</h2>

        <a href="{{ url_for('produccion.produccion_departamentos', fecha=fecha) }}" class="btn btn-secondary">
            Volver
        </a>
    </div>

    <!-- BUSCADOR -->
    <div style="padding:15px;">
        <input type="text" id="buscadorSub" placeholder="Buscar subdepartamento..." class="form-control">
    </div>

    <!-- TABLA -->
    <div class="table-container">
        <table class="table table-hover" id="tablaSub">
            <thead>
                <tr>
                    <th>Subdepartamento</th>
                    <th style="text-align:center;">Partes</th>
                    <th style="text-align:center;">Líneas</th>
                    <th style="text-align:center;">Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for s in subdepartamentos %}
                <tr>
                    <td><strong>{{ s.nombre }}</strong></td>

                    <td style="text-align:center;">
                        <span class="badge bg-info">{{ s.num_partes or 0 }}</span>
                    </td>

                    <td style="text-align:center;">
                        <span class="badge bg-secondary">{{ s.num_lineas or 0 }}</span>
                    </td>

                    <td style="text-align:center;">
                        <a href="{{ url_for('produccion.produccion_subdepartamento', subdepto_id=s.id, fecha=fecha) }}" class="btn btn-sm btn-info">Ver</a>

                        <a href="/subdepartamentos/{{ s.id }}/editar" class="btn btn-sm btn-primary">Editar</a>

                        <form method="POST"
                              action="/subdepartamentos/{{ s.id }}/eliminar"
                              style="display:inline;"
                              onsubmit="return confirm('¿Eliminar subdepartamento?');">
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="text-align:center;">No hay subdepartamentos</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<script>
document.getElementById('buscadorSub').addEventListener('keyup', function() {
    let filtro = this.value.toLowerCase();
    let filas = document.querySelectorAll("#tablaSub tbody tr");

    filas.forEach(f => {
        let texto = f.innerText.toLowerCase();
        f.style.display = texto.includes(filtro) ? "" : "none";
    });
});
</script>

{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #000;
            padding: 6px;
        }

        th {
            background: #eee;
        }
    </style>
</head>
<body>

<h1>Pedido #{{ pedido.id }}</h1>

<p><strong>Fecha:</strong> {{ pedido.fecha }}</p>
<p><strong>Proveedor:</strong> {{ pedido.proveedor_id }}</p>

<table>
    <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        {% for l in lineas %}
        <tr>
            <td>{{ l.nombre }}</td>
            <td>{{ l.cantidad }}</td>
            <td>{{ l.precio }}</td>
            <td>{{ l.cantidad * l.precio }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>

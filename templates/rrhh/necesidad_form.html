{% extends 'base.html' %}
{% block title %}Editar necesidad operativa{% endblock %}
{% block breadcrumb %}RRHH / Necesidades / Editar{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-clipboard-list"></i> Editar necesidad operativa</h2>
    </div>
    <form method="post">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;">
            <div class="form-group">
                <label class="form-label">Centro</label>
                <select name="centro_id" class="form-control">
                    <option value="">General</option>
                    {% for c in centros %}<option value="{{ c.id }}" {% if necesidad.centro_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Departamento</label>
                <select name="departamento_id" class="form-control">
                    <option value="">General</option>
                    {% for d in departamentos %}<option value="{{ d.id }}" {% if necesidad.departamento_id == d.id %}selected{% endif %}>{{ d.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Subdepartamento</label>
                <select name="subdepartamento_id" class="form-control">
                    <option value="">General</option>
                    {% for sd in subdepartamentos %}<option value="{{ sd.id }}" {% if necesidad.subdepartamento_id == sd.id %}selected{% endif %}>{{ sd.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Puesto</label>
                <select name="puesto_id" class="form-control">
                    <option value="">General</option>
                    {% for p in puestos %}<option value="{{ p.id }}" {% if necesidad.puesto_id == p.id %}selected{% endif %}>{{ p.nombre }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Día semana</label>
                <select name="dia_semana" class="form-control">
                    {% for i,n in dias_semana %}<option value="{{ i }}" {% if necesidad.dia_semana == i %}selected{% endif %}>{{ n }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Personas necesarias</label>
                <input type="number" name="personas_necesarias" class="form-control" value="{{ necesidad.personas_necesarias or 1 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Inicio</label>
                <input type="time" name="hora_inicio" class="form-control" value="{{ necesidad.hora_inicio or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Fin</label>
                <input type="time" name="hora_fin" class="form-control" value="{{ necesidad.hora_fin or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Tipo turno</label>
                <select name="tipo_turno" class="form-control">
                    {% for valor, nombre in [('', 'Sin definir'), ('seguido', 'Seguido'), ('partido', 'Partido'), ('servicio', 'Servicio'), ('noche', 'Noche')] %}
                        <option value="{{ valor }}" {% if (necesidad.tipo_turno or '') == valor %}selected{% endif %}>{{ nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Horas día</label>
                <input type="number" step="0.25" min="0" name="horas_dia" class="form-control" value="{{ necesidad.horas_dia or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Plantilla objetivo</label>
                <input type="number" step="0.1" min="0" name="plantilla_objetivo" class="form-control" value="{{ necesidad.plantilla_objetivo or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Etiqueta</label>
                <input name="etiqueta_operativa" class="form-control" value="{{ necesidad.etiqueta_operativa or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Activa</label>
                <label style="display:flex;gap:8px;align-items:center;margin-top:10px;">
                    <input type="checkbox" name="activo" {% if necesidad.activo %}checked{% endif %}> Sí
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Libranzas</label>
            <textarea name="cobertura_libranzas" class="form-control">{{ necesidad.cobertura_libranzas or '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" class="form-control">{{ necesidad.observaciones or '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Motivo del cambio</label>
            <input name="motivo_cambio" class="form-control" required>
        </div>
        <button class="btn btn-success">Guardar</button>
        <a class="btn btn-secondary" href="{{ url_for('rrhh.necesidades_operativas') }}">Volver</a>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Editar turno{% endblock %}
{% block breadcrumb %}RRHH / Cuadrante / Editar turno{% endblock %}
{% block content %}
<div class="card"><div class="card-header"><h2><i class="fas fa-calendar-alt"></i> Editar turno/cuadrante</h2></div>
<form method="post"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;">
<div class="form-group"><label class="form-label">Empleado</label><select name="empleado_id" class="form-control" required>{% for e in empleados %}<option value="{{ e.id }}" {% if turno.empleado_id == e.id %}selected{% endif %}>{{ e.nombre }} {{ e.apellidos or '' }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Fecha</label><input type="date" name="fecha" class="form-control" value="{{ turno.fecha }}" required></div>
<div class="form-group"><label class="form-label">Inicio</label><input type="time" name="hora_inicio" class="form-control" value="{{ turno.hora_inicio }}" required></div>
<div class="form-group"><label class="form-label">Fin</label><input type="time" name="hora_fin" class="form-control" value="{{ turno.hora_fin }}" required></div>
<div class="form-group"><label class="form-label">Tipo</label><input name="tipo" class="form-control" value="{{ turno.tipo or 'normal' }}"></div>
<div class="form-group"><label class="form-label">Estado</label><select name="estado" class="form-control">{% for s in ['planificado','confirmado','trabajado','anulado'] %}<option value="{{ s }}" {% if turno.estado == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Centro</label><select name="centro_id" class="form-control"><option value="">Sin centro</option>{% for c in centros %}<option value="{{ c.id }}" {% if turno.centro_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Departamento</label><select name="departamento_id" class="form-control"><option value="">Según empleado</option>{% for d in departamentos %}<option value="{{ d.id }}" {% if turno.departamento_id == d.id %}selected{% endif %}>{{ d.nombre }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Subdepartamento</label><select name="subdepartamento_id" class="form-control"><option value="">Sin subdepto</option>{% for sd in subdepartamentos %}<option value="{{ sd.id }}" {% if turno.subdepartamento_id == sd.id %}selected{% endif %}>{{ sd.nombre }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Puesto</label><select name="puesto_id" class="form-control"><option value="">Sin puesto</option>{% for p in puestos %}<option value="{{ p.id }}" {% if turno.puesto_id == p.id %}selected{% endif %}>{{ p.nombre }}</option>{% endfor %}</select></div>
</div><div class="form-group"><label class="form-label">Observaciones</label><textarea name="observaciones" class="form-control">{{ turno.observaciones or '' }}</textarea></div>
<div class="form-group"><label class="form-label">Motivo del cambio</label><input name="motivo_cambio" class="form-control" required></div>
<button class="btn btn-success">Guardar</button> <a class="btn btn-secondary" href="{{ url_for('rrhh.cuadrante_real', fecha=turno.fecha) }}">Volver</a></form></div>
{% endblock %}

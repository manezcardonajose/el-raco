{% extends "base.html" %}
{% block title %}Prueba de pago{% endblock %}
{% block breadcrumb %}Pagos / Prueba{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header"><h2><i class="fas fa-vial"></i> Prueba de cobro</h2></div>
  <form method="post" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end;">
    <div class="form-group">
      <label class="form-label">Pasarela</label>
      <select class="form-control" name="config_id" required>
        {% for c in configs %}
        <option value="{{ c.id }}">{{ c.nombre }} - {{ c.proveedor }} ({{ c.modo }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Importe</label>
      <input class="form-control" type="number" step="0.01" min="0.01" name="importe" value="12.50" required>
    </div>
    <div class="form-group">
      <label class="form-label">Metodo</label>
      <select class="form-control" name="metodo">
        {% for code,label in metodos %}
        <option value="{{ code }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Descripcion</label>
      <input class="form-control" name="descripcion" value="Pago de prueba El Raco">
    </div>
    <div class="form-group">
      <label class="form-label">Cliente</label>
      <input class="form-control" name="cliente_nombre" value="Cliente demo">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" name="cliente_email" value="demo@nexoraia.studio">
    </div>
    <button class="btn btn-primary" type="submit"><i class="fas fa-credit-card"></i> Crear operacion</button>
  </form>
  {% if not configs %}
  <div class="alert alert-warning" style="margin-top:16px;">Primero crea una pasarela activa.</div>
  {% endif %}
</div>
{% endblock %}

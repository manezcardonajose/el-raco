{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-plus-circle"></i> REGISTRAR LOTE EN RECEPCIN</h2>
        <a href="{{ url_for('lotes.lista_lotes') }}" class="btn btn-secondary">Volver</a>
    </div>

    <form method="POST">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
            <div class="form-group">
                <label class="form-label">Producto *</label>
                <select name="producto_id" required class="form-control">
                    <option value="">-- Seleccionar producto --</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" data-depto="{{ p.departamento_nombre }}">
                        {{ p.nombre }} ({{ p.tiempo_descongelado_horas or 0 }}h)
                        {% if p.departamento_nombre %} - {{ p.departamento_nombre }}{% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Proveedor</label>
                <select name="proveedor_id" class="form-control">
                    <option value="">-- Sin proveedor --</option>
                    {% for pr in proveedores %}
                    <option value="{{ pr.id }}">{{ pr.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Código de lote proveedor</label>
                <input type="text" name="codigo_lote" class="form-control" placeholder="Si se deja vacío, la ERP genera lote interno">
                <small style="color:#9fb1c5;">La etiqueta siempre tendrá lote. Si el proveedor no lo trae, se genera uno interno.</small>
            </div>

            <div class="form-group">
                <label class="form-label">Fecha caducidad</label>
                <input type="date" name="fecha_caducidad" class="form-control" value="{{ now.strftime('%Y-%m-%d') }}">
            </div>

            <div class="form-group">
                <label class="form-label">Cantidad *</label>
                <input type="number" step="0.01" name="cantidad" required class="form-control" value="0">
            </div>

            <div class="form-group">
                <label class="form-label">Temperatura recepcin (°C) *</label>
                <input type="number" step="0.1" name="temperatura" required class="form-control" value="0">
            </div>

            <div class="form-group">
                <label class="form-label">Ubicacin inicial</label>
                <input type="text" name="ubicacion" class="form-control" placeholder="Ej: Congelador 1 - Estante A3">
            </div>
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-save"></i> Registrar lote
            </button>
        </div>
    </form>
</div>
{% endblock %}

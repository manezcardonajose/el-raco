{% extends "base.html" %}

{% block breadcrumb %}Editar Empresa{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-edit"></i> Editar Empresa</h2>
        <a href="{{ url_for('empresas.listar_empresas') }}" class="btn btn-danger">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    
    <form method="POST" enctype="multipart/form-data">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label class="form-label">Nombre de la empresa</label>
                <input type="text" name="nombre" value="{{ empresa.nombre }}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">NIF / CIF</label>
                <input type="text" name="nif" value="{{ empresa.nif or '' }}" class="form-control">
            </div>
            
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" value="{{ empresa.telefono or '' }}" class="form-control">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{ empresa.email or '' }}" class="form-control">
            </div>
            
            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Dirección</label>
                <input type="text" name="direccion" value="{{ empresa.direccion or '' }}" class="form-control">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Logo / anagrama para documentos</label>
                {% if empresa.logo %}
                <div style="margin-bottom:8px;">
                    <img src="{{ url_for('static', filename=empresa.logo) if not empresa.logo.startswith('/static/') and not empresa.logo.startswith('http') else empresa.logo }}" alt="Logo empresa" style="max-width:140px;max-height:80px;object-fit:contain;background:#fff;border:1px solid #ddd;padding:6px;">
                </div>
                {% endif %}
                <input type="hidden" name="logo_actual" value="{{ empresa.logo or '' }}">
                <input type="file" name="logo" class="form-control" accept="image/png,image/jpeg,image/webp,image/gif">
            </div>
        </div>
        
        <div class="form-group" style="margin-top: 20px;">
            <label style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" name="activo" {% if empresa.activo %}checked{% endif %}>
                <span>Empresa activa</span>
            </label>
        </div>
        
        <div style="margin-top: 30px;">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
            <a href="{{ url_for('empresas.listar_empresas') }}" class="btn btn-danger">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}

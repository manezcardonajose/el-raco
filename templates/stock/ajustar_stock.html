{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>️ Ajustar Stock: {{ producto.nombre }}</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Almacn:</label>
            <select name="almacen_id" required style="width: 100%; padding: 8px;">
                {% for a in almacenes %}
                <option value="{{ a.id }}">{{ a.nombre }} ({{ a.tipo }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Cantidad (positiva para entrada, negativa para salida):</label>
            <input type="number" step="0.01" name="cantidad" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Motivo:</label>
            <input type="text" name="motivo" placeholder="Ej: Inventario, Recepcin, Merma..." style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success"> Guardar ajuste</button>
            <a href="/stock" class="btn btn-red"> Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

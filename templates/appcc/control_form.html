{% extends "base.html" %}

{% block title %}Control APPCC - El Raco ERP{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-plus-circle"></i> Nuevo control APPCC</h2>
        <a href="{{ url_for('appcc.plan_appcc') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>

    <form method="POST">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;">
            <div class="form-group">
                <label class="form-label">Codigo</label>
                <input type="text" name="codigo" class="form-control" placeholder="Ej: FRIO-02">
            </div>
            <div class="form-group">
                <label class="form-label">Area</label>
                <input type="text" name="area" class="form-control" required placeholder="Ej: Camaras">
            </div>
            <div class="form-group">
                <label class="form-label">Etapa</label>
                <input type="text" name="etapa" class="form-control" placeholder="Ej: Conservacion">
            </div>
            <div class="form-group">
                <label class="form-label">Tipo de control</label>
                <select name="tipo_control" class="form-control">
                    <option value="prerrequisito">Prerequisito</option>
                    <option value="pcc">PCC</option>
                    <option value="verificacion">Verificacion</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Frecuencia</label>
                <input type="text" name="frecuencia" class="form-control" placeholder="Cada servicio, diario, semanal...">
            </div>
            <div class="form-group">
                <label class="form-label">Responsable</label>
                <input type="text" name="responsable" class="form-control" placeholder="Departamento o cargo">
            </div>
            <div class="form-group">
                <label class="form-label">Modulo origen</label>
                <input type="text" name="modulo_origen" class="form-control" placeholder="compras, produccion, stock...">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Peligro que controla</label>
            <textarea name="peligro" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Medida preventiva</label>
            <textarea name="medida_preventiva" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Limite critico / criterio de aceptacion</label>
            <textarea name="limite_critico" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Accion correctiva</label>
            <textarea name="accion_correctiva" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Verificacion</label>
            <textarea name="verificacion" class="form-control" rows="3"></textarea>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Guardar control
            </button>
            <a href="{{ url_for('appcc.plan_appcc') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

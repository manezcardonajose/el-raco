{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2> Buscar trazabilidad</h2>
    
    <form action="/appcc/trazabilidad/lote" method="GET" style="max-width: 500px; margin: 20px auto;">
        <div style="margin-bottom: 15px;">
            <label>Cdigo de lote:</label>
            <input type="text" name="codigo_lote" required style="width: 100%; padding: 8px;">
        </div>
        
        <button type="submit" class="btn btn-success">Buscar</button>
        <a href="/appcc" class="btn btn-red">Cancelar</a>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Editar subdepartamento</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ sub.nombre }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Descripción:</label>
            <textarea name="descripcion" rows="4" style="width: 100%; padding: 8px;">{{ sub.descripcion or '' }}</textarea>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>
                <input type="checkbox" name="activo" {% if sub.activo %}checked{% endif %}> Subdepartamento activo
            </label>
        </div>
        
        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="/departamentos/{{ sub.departamento_id }}" class="btn btn-red">Cancelar</a>
    </form>
</div>
{% endblock %}

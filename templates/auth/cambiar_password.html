{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 50px auto;">
    <div class="card-header">
        <h2><i class="fas fa-key"></i> Cambiar contraseña</h2>
        <a href="{% if next_destino == 'portal_empleado' %}{{ url_for('rrhh.portal_empleado') }}{% else %}{{ url_for('auth.perfil') }}{% endif %}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        {% if next_destino %}
        <input type="hidden" name="next" value="{{ next_destino }}">
        {% endif %}
        <div class="form-group">
            <label class="form-label">Contraseña actual</label>
            <input type="password" name="password_actual" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" name="password_nueva" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Confirmar nueva contraseña</label>
            <input type="password" name="confirm_password" required class="form-control">
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Cambiar contraseña</button>
    </form>
</div>
{% endblock %}

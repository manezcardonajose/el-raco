{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-user-plus"></i> Nuevo usuario</h2>
        <a href="{{ url_for('auth.listar_usuarios') }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Codigo de acceso</label>
            <input type="text" name="codigo_acceso" class="form-control" placeholder="Se genera automaticamente si lo dejas vacio">
        </div>
        <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" required class="form-control" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label class="form-label">Rol</label>
            <select name="rol_id" required class="form-control">
                {% for r in roles %}
                <option value="{{ r.id }}">{{ r.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Empleado vinculado</label>
            <select name="empleado_id" class="form-control">
                <option value="">Sin empleado</option>
                {% for e in empleados %}
                <option value="{{ e.id }}">{{ e.nombre }} {{ e.apellidos or '' }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="padding: 15px; margin-bottom: 20px; border: 1px solid #2c3e50; border-radius: 6px; background: #1e252b;">
            <div class="form-label" style="margin-bottom: 12px;">Permisos directos del usuario</div>
            <label style="display:block; margin-bottom: 8px;">
                <input type="checkbox" name="es_global"> Acceso global a todos los departamentos
            </label>
            <label style="display:block; margin-bottom: 8px;">
                <input type="checkbox" name="puede_ver_precios"> Puede ver precios y costes
            </label>
            <label style="display:block; margin-bottom: 8px;">
                <input type="checkbox" name="puede_modificar_precios"> Puede modificar precios
            </label>
            <label style="display:block; margin-bottom: 8px;">
                <input type="checkbox" name="puede_validar_recepcion"> Puede validar caja/facturacion de recepcion
            </label>
            <label style="display:block;">
                <input type="checkbox" name="puede_validar_economicamente"> Puede validar economicamente compras
            </label>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Crear usuario</button>
    </form>
</div>
{% endblock %}

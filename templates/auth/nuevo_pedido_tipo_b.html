{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-truck"></i> Nuevo pedido por proveedor</h2>
        <a href="{{ url_for('compras.lista_pedidos') }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Proveedor</label>
            <select name="proveedor_id" id="proveedor_id" required class="form-control">
                <option value="">Seleccionar proveedor...</option>
                {% for p in proveedores %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Departamento</label>
            <select name="departamento_id" required class="form-control">
                <option value="">Seleccionar departamento...</option>
                {% for d in departamentos %}<option value="{{ d.id }}">{{ d.nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Fecha de entrega</label>
            <input type="date" name="fecha_entrega" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" rows="3" class="form-control"></textarea>
        </div>

        <h3>Productos a pedir</h3>
        <div id="productos-container">
            <div class="producto-fila" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <select name="producto_id[]" class="form-control" style="flex: 3;" required>
                    <option value="">Seleccionar producto...</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" data-precio="{{ p.precio or 0 }}" data-proveedor="{{ p.proveedor_id }}">{{ p.nombre }} ({{ p.codigo or 'sin código' }}) - {{ "%.2f"|format(p.precio or 0) }} €</option>
                    {% endfor %}
                </select>
                <input type="number" step="0.001" name="cantidad[]" class="form-control" style="flex: 1;" placeholder="Cantidad" required>
                <input type="number" step="0.01" name="precio[]" class="form-control" style="flex: 1;" placeholder="Precio" required>
                <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.producto-fila').remove()"><i class="fas fa-trash"></i></button>
            </div>
        </div>
        <button type="button" class="btn btn-primary btn-sm" onclick="anadirProducto()"><i class="fas fa-plus"></i> Añadir producto</button>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Crear pedido</button>
        </div>
    </form>
</div>

<script>
function anadirProducto() {
    const container = document.getElementById('productos-container');
    const div = document.createElement('div');
    div.className = 'producto-fila';
    div.style.display = 'flex';
    div.style.gap = '10px';
    div.style.marginBottom = '10px';
    div.innerHTML = `
        <select name="producto_id[]" class="form-control" style="flex: 3;" required>
            <option value="">Seleccionar producto...</option>
            {% for p in productos %}
            <option value="{{ p.id }}" data-precio="{{ p.precio or 0 }}" data-proveedor="{{ p.proveedor_id }}">{{ p.nombre }} ({{ p.codigo or 'sin código' }}) - {{ "%.2f"|format(p.precio or 0) }} €</option>
            {% endfor %}
        </select>
        <input type="number" step="0.001" name="cantidad[]" class="form-control" style="flex: 1;" placeholder="Cantidad" required>
        <input type="number" step="0.01" name="precio[]" class="form-control" style="flex: 1;" placeholder="Precio" required>
        <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.producto-fila').remove()"><i class="fas fa-trash"></i></button>
    `;
    container.appendChild(div);
}

document.getElementById('proveedor_id').addEventListener('change', function() {
    const proveedorId = this.value;
    const productos = document.querySelectorAll('select[name="producto_id[]"]');
    productos.forEach(select => {
        const options = select.querySelectorAll('option');
        options.forEach(option => {
            if (option.value && option.getAttribute('data-proveedor') !== proveedorId && option.value !== '') {
                option.style.display = 'none';
            } else {
                option.style.display = '';
            }
        });
    });
});
</script>
{% endblock %}

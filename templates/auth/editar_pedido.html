{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fas fa-edit"></i> Editar pedido {{ pedido.numero_pedido }}</h2>
        <a href="{{ url_for('compras.ver_pedido', pedido_id=pedido.id) }}" class="btn btn-secondary">Volver</a>
    </div>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Fecha entrega</label>
            <input type="date" name="fecha_entrega" value="{{ pedido.fecha_entrega or '' }}" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" rows="3" class="form-control">{{ pedido.observaciones or '' }}</textarea>
        </div>

        <h3>Líneas del pedido</h3>
        <div id="lineas-container">
            {% for l in lineas %}
            <div class="linea-fila" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <select name="producto_id[]" class="form-control" style="flex: 2;" required>
                    <option value="">Seleccionar...</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" {% if p.id == l.producto_id %}selected{% endif %}>{{ p.nombre }} ({{ p.codigo or 'sin código' }})</option>
                    {% endfor %}
                </select>
                <input type="number" step="0.001" name="cantidad[]" value="{{ l.cantidad_solicitada }}" class="form-control" style="flex: 1;" placeholder="Cantidad" required>
                <input type="number" step="0.01" name="precio[]" value="{{ l.precio_unitario }}" class="form-control" style="flex: 1;" placeholder="Precio" required>
                <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.linea-fila').remove()"><i class="fas fa-trash"></i></button>
            </div>
            {% endfor %}
        </div>
        <button type="button" class="btn btn-primary btn-sm" onclick="anadirLinea()"><i class="fas fa-plus"></i> Añadir línea</button>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar cambios</button>
        </div>
    </form>
</div>

<script>
function anadirLinea() {
    const container = document.getElementById('lineas-container');
    const div = document.createElement('div');
    div.className = 'linea-fila';
    div.style.display = 'flex';
    div.style.gap = '10px';
    div.style.marginBottom = '10px';
    div.innerHTML = `
        <select name="producto_id[]" class="form-control" style="flex: 2;" required>
            <option value="">Seleccionar...</option>
            {% for p in productos %}
            <option value="{{ p.id }}">{{ p.nombre }} ({{ p.codigo or 'sin código' }})</option>
            {% endfor %}
        </select>
        <input type="number" step="0.001" name="cantidad[]" class="form-control" style="flex: 1;" placeholder="Cantidad" required>
        <input type="number" step="0.01" name="precio[]" class="form-control" style="flex: 1;" placeholder="Precio" required>
        <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.linea-fila').remove()"><i class="fas fa-trash"></i></button>
    `;
    container.appendChild(div);
}
</script>
{% endblock %}
